client:
  inventory:
    base-url: ${INVENTORY_SERVICE_URL:http://localhost:8082}
  item:
    base-url: ${ITEM_SERVICE_URL:http://localhost:8083}
  user:
    base-url: ${USER_SERVICE_URL:http://localhost:8084}

spring:
  application:
    name: procurementService
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/erp/protocol/openid-connect/certs}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:procurement}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        # ddl-auto=create/create-drop로 스키마를 새로 만든 직후 import.sql을 1회 실행(로컬 시드). update/validate에선 미실행.
        hbm2ddl:
          import_files: /import.sql
          import_files_sql_extractor: org.hibernate.tool.schema.internal.script.MultiLineSqlScriptExtractor
          charset_name: UTF-8
    open-in-view: false

springdoc:
  api-docs:
    path: /procurement-orders/v3/api-docs
  swagger-ui:
    path: /procurement-orders/swagger-ui.html
