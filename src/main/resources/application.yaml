client:
  inventory:
    base-url: ${INVENTORY_SERVICE_URL:http://inventory-service:8080}
  item:
    base-url: ${ITEM_SERVICE_URL:http://item-service:8080}
  user:
    base-url: ${USER_SERVICE_URL:http://user-service:8080}

spring:
  application:
    name: procurement-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://auth.erp007.xyz/realms/master}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:https://auth.erp007.xyz/realms/master/protocol/openid-connect/certs}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://procurement-postgres:5432/procurement_db}
    username: ${SPRING_DATASOURCE_USERNAME:procurement_user}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # 스키마는 Flyway가 관리한다. Hibernate는 엔티티-스키마 일치 여부만 검증.
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        # 처리 실패 시 큐로 되돌리지 않고 DLX로 보낸다(무한 재처리 방지).
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s

springdoc:
  api-docs:
    path: /procurement-orders/v3/api-docs
  swagger-ui:
    path: /procurement-orders/swagger-ui.html
